<!-- templates/base.html -->
<!DOCTYPE html>
{% load static %}
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SmartShop — Your one-stop e-commerce destination for electronics, fashion, home essentials, and more. Shop now with secure payments and fast delivery." />
    <title>{% block title %}SmartShop - Online Shopping{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/smartshop-logo.png' %}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom styles -->
    <link
      href="{% static 'css/style.css' %}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{% static 'css/enhancements.css' %}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{% static 'css/premium.css' %}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      href="{% static 'css/responsive.css' %}"
      rel="stylesheet"
      media="only screen and (max-width: 1200px)"
    />
    <!-- Font awesome 5 -->
    <link
      href="{% static 'fonts/fontawesome/css/all.min.css' %}"
      type="text/css"
      rel="stylesheet"
    />

    <!-- jQuery (CDN) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <!-- PayPal Script (client id from environment via context processor) -->
    <script 
      src="https://www.paypal.com/sdk/js?client-id={{ PAYPAL_CLIENT_ID }}&currency=USD"
      id="paypal-sdk"
      onload="console.log('PayPal SDK loaded successfully.');"
      onerror="console.error('PayPal SDK could not be loaded. Check internet or ad blockers.');"
    ></script>

    <!-- Razorpay Script -->
    <script 
      src="https://checkout.razorpay.com/v1/checkout.js"
      id="razorpay-sdk"
      onload="console.log('Razorpay SDK loaded successfully.');"
      onerror="console.error('Razorpay SDK could not be loaded. Check internet or ad blockers.');"
    ></script>

    <style>
      body {
        font-family: 'Inter', 'Roboto', sans-serif;
      }
    </style>
  </head>

  <body>
    {% include "includes/navbar.html" %}

    <main>
      {% block content %}
      <h1>Welcome to Our Store</h1>
      <p>Explore our latest products and offers.</p>
      {% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTop" title="Back to Top">
      <i class="fa fa-chevron-up"></i>
    </button>

    <!-- Global JavaScript: Back to Top + Toast System + Dark Mode -->
    <script>
      // ===== BACK TO TOP =====
      (function() {
        const btn = document.getElementById('backToTop');
        if (!btn) return;
        
        window.addEventListener('scroll', function() {
          if (window.scrollY > 300) {
            btn.classList.add('show');
          } else {
            btn.classList.remove('show');
          }
        });
        
        btn.addEventListener('click', function() {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      })();

      // ===== TOAST NOTIFICATION SYSTEM =====
      function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        const iconMap = {
          success: '<i class="fa fa-check-circle toast-icon success"></i>',
          error: '<i class="fa fa-times-circle toast-icon error"></i>',
          info: '<i class="fa fa-info-circle toast-icon info"></i>'
        };

        const toast = document.createElement('div');
        toast.className = `toast-notification toast-${type}`;
        toast.innerHTML = `
          ${iconMap[type] || iconMap.success}
          <span class="toast-message">${message}</span>
          <button class="toast-close" onclick="this.parentElement.remove()">
            <i class="fa fa-times"></i>
          </button>
        `;
        
        container.appendChild(toast);
        
        // Auto-remove after 3 seconds
        setTimeout(() => {
          if (toast.parentElement) toast.remove();
        }, 3000);
      }

      // Show toast for Django messages (if any exist on page)
      document.addEventListener('DOMContentLoaded', function() {
        const alerts = document.querySelectorAll('.alert[data-toast]');
        alerts.forEach(function(alert) {
          const msg = alert.textContent.trim();
          const type = alert.classList.contains('alert-danger') ? 'error' : 
                       alert.classList.contains('alert-info') ? 'info' : 'success';
          if (msg) showToast(msg, type);
          alert.style.display = 'none';
        });
      });

      // ===== DARK MODE TOGGLE =====
      (function() {
        const savedTheme = localStorage.getItem('smartshop-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        
        // Update icon after DOM loads
        document.addEventListener('DOMContentLoaded', function() {
          const toggleBtn = document.getElementById('darkModeToggle');
          if (toggleBtn) {
            const icon = toggleBtn.querySelector('i');
            if (savedTheme === 'dark') {
              icon.className = 'fa fa-sun';
            } else {
              icon.className = 'fa fa-moon';
            }
          }
        });
      })();

      function toggleDarkMode() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        
        html.setAttribute('data-theme', next);
        localStorage.setItem('smartshop-theme', next);
        
        const toggleBtn = document.getElementById('darkModeToggle');
        if (toggleBtn) {
          const icon = toggleBtn.querySelector('i');
          icon.className = next === 'dark' ? 'fa fa-sun' : 'fa fa-moon';
        }
      }

      // ===== CART COUNTER BOUNCE =====
      document.addEventListener('DOMContentLoaded', function() {
        const cartBadge = document.querySelector('.cart-badge');
        if (cartBadge) {
          // Bounce on page load if cart has items
          const count = parseInt(cartBadge.textContent);
          if (count > 0) {
            cartBadge.classList.add('bounce');
            setTimeout(() => cartBadge.classList.remove('bounce'), 600);
          }
        }
      });
    </script>
  </body>
</html>
