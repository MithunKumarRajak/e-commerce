<aside class="col-md-3">
    <!--   SIDEBAR   -->
    <div class="card shadow-sm mb-3">
        <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action {% if '/accounts/dashboard/' in request.path or request.path == '/accounts/' %}active{% endif %}" 
               href="{% url 'dashboard' %}">
                <i class="fa fa-tachometer-alt me-2"></i> Dashboard 
            </a>
            <a class="list-group-item list-group-item-action {% if '/orders/' in request.path or 'my_orders' in request.path %}active{% endif %}" 
               href="{% url 'my_orders' %}">
                <i class="fa fa-shopping-bag me-2"></i> My Orders 
            </a>
            <a class="list-group-item list-group-item-action {% if 'edit_profile' in request.path %}active{% endif %}"
                href="{% url 'edit_profile' %}"> 
                <i class="fa fa-user-edit me-2"></i> Edit Profile 
            </a>
            <a class="list-group-item list-group-item-action {% if 'change_password' in request.path %}active{% endif %}"
                href="{% url 'change_password' %}"> 
                <i class="fa fa-key me-2"></i> Change Password 
            </a>
        </div>
    </div>
    
    <a class="btn btn-outline-danger w-100" href="{% url 'logout' %}"> 
        <i class="fa fa-sign-out-alt me-2"></i> Log out 
    </a>
    <!--   SIDEBAR .//END   -->
</aside>
